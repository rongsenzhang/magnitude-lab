name: Verify and publish Magnitude Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify statistical results and interface snapshots
        run: |
          python research/generate.py --check
          python -m integration.reviewer_bundle --check
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Verify evidence and the server-side OpenAI adapter
        run: |
          npm run test:ai
          npx --no-install wrangler deploy --dry-run --config worker/wrangler.toml
      - name: Exercise desktop and mobile workflows
        run: |
          npm run test:browser
          npm run test:assistant-browser
      - name: Connect the optional assistant for publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          AI_WORKER_URL: ${{ vars.AI_WORKER_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: python scripts/configure_assistant.py
      - name: Package the tested site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
